<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111922" />
  <meta name="description" content="ASTERIA — あなたの設計で星の宿を育てる、小惑星リゾート運営ゲーム。" />
  <title>ASTERIA — 小惑星リゾート</title>
  <link rel="stylesheet" href="style.css?v=asteria-6" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup"><span class="brand-sigil">✦</span><div><b>ASTERIA</b><small class="sr-only">小惑星リゾート</small></div></div>
      <div class="season-tag" id="seasonTag">SEASON 01 · DAY 01 / 07</div>
      <button class="icon-btn" id="soundButton" aria-label="サウンド切替">♫</button>
    </header>

    <section class="resource-strip" aria-label="リゾート資源">
      <div class="resource" title="クレジット"><span class="resource-icon credit-icon">◈</span><span><b id="creditsValue">0</b><small class="sr-only">クレジット</small></span></div>
      <div class="resource" title="評判"><span class="resource-icon rep-icon">✧</span><span><b id="ratingValue">★☆☆☆☆</b><small class="sr-only">評判 <i id="repValue">25</i></small></span></div>
      <div class="resource" title="酸素"><span class="resource-icon oxygen-icon">◉</span><span><b id="oxygenValue">0 / 0</b><small class="sr-only">酸素</small></span></div>
      <div class="resource" title="電力"><span class="resource-icon power-icon">⌁</span><span><b id="powerValue">0 / 0</b><small class="sr-only">電力</small></span></div>
    </section>

    <div class="daily-banner" id="dailyBanner"><span class="event-icon" id="eventIcon">☄</span><span class="event-copy"><b id="eventTitle">流星雨の夜</b><small id="eventText" class="sr-only">星見が好きな客の満足度が上がる</small></span><span class="event-countdown">TONIGHT</span></div>

    <section class="command-deck" id="commandDeck" aria-label="リゾート">
      <section class="game-panel map-panel" id="mapPanel"></section>
    </section>
  </main>

  <div class="management-backdrop hidden" id="managementBackdrop">
    <section class="management-sheet" id="managementSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
      <div id="sheetContent"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="閉じる">×</button>
      <div class="modal-kicker" id="modalKicker">NIGHT REPORT</div>
      <h2 id="modalTitle">今夜の滞在記録</h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </div>

  <script src="game.js?v=asteria-6"></script>
</body>
</html>
