<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17162f" />
  <meta name="description" content="小さな星の宿で、旅人の願いをひとつかなえる、やさしい5夜のゲーム。" />
  <title>ASTERIA — ほしのちいさな宿</title>
  <link rel="stylesheet" href="style.css?v=moonberry-1" />
</head>
<body>
  <main class="game-screen" aria-label="ほしのちいさな宿">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span><b>ASTERIA</b><small>ほしのちいさな宿</small></span></div>
      <div class="night-progress" aria-label="5夜の進み具合"><span id="dayLabel">1 / 5 夜</span><div class="night-dots" id="nightDots" aria-hidden="true"></div></div>
    </header>

    <section class="scene" id="scene" aria-label="星のキャンプ">
      <div class="scene-art" aria-hidden="true"></div>
      <div class="sky-glow" aria-hidden="true"></div>
      <div class="guest-note" id="guestNote" aria-live="polite"></div>
      <div class="traveler" id="traveler" aria-hidden="true"></div>
      <div class="scene-whisper" id="sceneWhisper">星がきらきら、今夜もいい夜。</div>
      <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
    </section>

    <section class="choice-panel" id="choicePanel" aria-live="polite">
      <div class="panel-heading">
        <span class="step-badge" id="stepBadge">1</span>
        <div><h1 id="panelTitle">今夜のおたのしみは？</h1><p id="panelHint">旅人のお願いに合うものをひとつ選ぼう</p></div>
      </div>
      <div class="activity-grid" id="activityGrid"></div>
      <div class="result-card" id="resultCard" hidden></div>
    </section>

    <button class="main-action" id="mainAction" type="button" disabled>
      <span class="action-icon" id="actionIcon" aria-hidden="true">✦</span><span id="actionLabel">おもてなしを選んでね</span><span class="action-arrow" aria-hidden="true">→</span>
    </button>
    <footer class="soft-footer"><span>ゆっくりでだいじょうぶ</span><span class="footer-star" aria-hidden="true">✧</span></footer>
  </main>
  <script src="game.js?v=moonberry-1" defer></script>
</body>
</html>
